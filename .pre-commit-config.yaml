# Git hooks managed by pre-commit (https://pre-commit.com). The same file runs locally and in CI.
#
#   pre-commit install                 # once per clone: installs the pre-commit, commit-msg AND pre-push hooks
#   pre-commit run --all-files         # run every pre-commit stage hook on the whole repo
#   pre-commit autoupdate --freeze     # bump the remote hooks and pin them to commit SHAs
#
# Local hooks ("language: system") use the project's virtual environment, so commit from a terminal where
# .venv is active (the PyCharm terminal activates it automatically).

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]          # hooks without "stages" run only before a commit, not at commit-msg

repos:
  # --- repository hygiene (Lab 3) -------------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files   # anything above 1 MB belongs in DVC, not in git
        args: ["--maxkb=1024"]
      - id: check-merge-conflict      # leftover <<<<<<< markers
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]  # two trailing spaces are a line break in Markdown
      - id: mixed-line-ending         # LF everywhere; Windows scripts keep CRLF (see .gitattributes)
        args: ["--fix=lf"]
        exclude: '\.(bat|cmd|ps1)$'
      - id: detect-private-key

  # --- secret scanning (Lab 3, version_control.pdf p.11) --------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  # --- professor's quality gates, run with the project's own tools and configuration -------------------------------
  - repo: local
    hooks:
      - id: flake8
        name: flake8 (PEP8, max line length 120)
        entry: python -m flake8
        language: system
        types: [python]

      - id: pyright-strict
        name: pyright gentle strict (src/)
        entry: python -m pyright
        language: system
        types: [python]
        pass_filenames: false         # pyright reads its scope (src/) from pyproject.toml

      - id: pyright-standard
        name: pyright standard (src/)
        entry: python -m pyright -p pyrightconfig.standard.json
        language: system
        types: [python]
        pass_filenames: false

      - id: tests
        name: pytest with coverage measurement
        entry: python -m coverage run -m pytest -q
        language: system
        pass_filenames: false
        always_run: true              # a change in any file (config, data) can break a test

      - id: coverage
        name: coverage >= 95% (src, tests, tools)
        entry: python -m coverage report --skip-covered
        language: system
        pass_filenames: false
        always_run: true              # reads .coverage written by the "tests" hook above

      - id: commit-message
        name: commit message format (version_control.pdf p.9)
        entry: python tools/check_commit_msg.py
        language: system
        stages: [commit-msg]          # git passes the path of the message file as the only argument

      - id: docker-build
        name: docker build of the app image
        # Needs Docker running; otherwise skip explicitly: SKIP=docker-build git push
        entry: docker build --quiet --file docker/app.Dockerfile --tag campaign-response-app:pre-push .
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(docker/|src/|requirements\.txt$|\.dockerignore$)
