# Local hooks use the active .venv: commit from a terminal where it is activated.
# Remote hooks are pinned with `pre-commit autoupdate --freeze`.

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files   # larger files belong in DVC
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.(bat|cmd|ps1)$'   # CRLF by design, see .gitattributes
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: python -m flake8
        language: system
        types: [python]

      - id: pyright-strict
        name: pyright gentle strict (src/)
        entry: python -m pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright-standard
        name: pyright standard (src/)
        entry: python -m pyright -p pyrightconfig.standard.json
        language: system
        types: [python]
        pass_filenames: false

      - id: tests
        name: pytest with coverage measurement
        entry: python -m coverage run -m pytest -q
        language: system
        pass_filenames: false
        always_run: true

      - id: coverage
        name: coverage >= 95%
        entry: python -m coverage report --skip-covered
        language: system
        pass_filenames: false
        always_run: true              # must stay after "tests": reads the .coverage file it writes

      - id: commit-message
        name: commit message format
        entry: python tools/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: docker-build
        name: docker build of the app image
        # Needs Docker running; otherwise skip explicitly: SKIP=docker-build git push
        entry: docker build --quiet --file docker/app.Dockerfile --tag campaign-response-app:pre-push .
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(docker/|src/|requirements\.txt$|\.dockerignore$)
