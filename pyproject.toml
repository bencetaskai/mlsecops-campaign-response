[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-response"
description = "MLSecOps project: campaign response prediction with MLflow, FastAPI, DVC, Evidently and Airflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Bence TÁSKAI" }]
dynamic = ["version"]
# Lower bounds only; exact pins are generated into requirements.txt.
dependencies = [
    "fastapi>=0.115",   # REST API; Starlette and Pydantic come with it
    "httpx2>=2.16",   # HTTP client of the bootstrap job and the smoke script; tested with its MockTransport
    "matplotlib>=3.9",
    "mlflow-skinny>=3.18,<3.19",   # client only; same minor version as the MLflow server image
    "pandas>=2.2",
    "psycopg[binary]>=3.2",   # Postgres driver for the prediction log; SQLAlchemy 2.1's default dialect
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "skops>=0.16",   # MLflow saves sklearn models as skops: loading cannot run arbitrary code, unlike pickle
    "sqlalchemy>=2.1",   # prediction log, written with Core: every value is a bound parameter
    "uvicorn>=0.30",   # ASGI server for the API
]

[tool.setuptools.dynamic]
version = { attr = "campaign_response.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# No editable install: its .pth file breaks on the accented Windows project path.
pythonpath = ["src", "tools", "tests"]   # tests: shared test doubles in tests/fakes.py
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
xfail_strict = true
markers = [
    "integration: runs against a real local MLflow (SQLite); part of the normal run, skip with -m 'not integration'",
]
filterwarnings = [
    "error",
    # Raised inside MLflow's own SQL store (only the local SQLite store of the adapter tests uses it); not our code.
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
    # MLflow's input-example code compares columns with range(); pandas 4 deprecates that. Limited to that module.
    "ignore:Operation with range is deprecated:pandas.errors.Pandas4Warning:mlflow.models.utils",
    # Emitted while MLflow imports its own pyfunc modules (their Any type hints), whatever our code does.
    "ignore:.*Any type hint is inferred as AnyType:UserWarning:mlflow",
]

[tool.coverage.run]
branch = true
source = ["src", "tests", "tools"]   # test code counts too (professor's rule)
relative_files = true
# No omit / exclude_lines: exclusions only as inline "# pragma: no cover - <reason>".

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
precision = 1

# Professor's "gentle strict" block (verbatim); standard mode: pyright -p pyrightconfig.standard.json
[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
pythonVersion = "3.12"
