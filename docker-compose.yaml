# First run: copy secrets_example/ to secrets/ and set your own values, then: docker compose up -d
# Containers reach MinIO as http://minio:9000, the host (DVC CLI) as http://localhost:9000.
# MLflow UI and API: http://localhost:5500 from the host, http://mlflow:5000 from containers.
# REST API and Swagger UI: http://localhost:8000/docs. For the git_sha lineage tag, build with
#   $env:GIT_SHA = git rev-parse --short HEAD; docker compose up --build -d
# Postgres has no host port: services reach it as postgres:5432; for a shell: docker compose exec postgres psql -U postgres

name: campaign-response

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

secrets:
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  mlflow_s3_secret_key:
    file: ./secrets/mlflow_s3_secret_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  mlflow_db_password:
    file: ./secrets/mlflow_db_password.txt
  airflow_db_password:
    file: ./secrets/airflow_db_password.txt
  monitoring_db_password:
    file: ./secrets/monitoring_db_password.txt
  api_key:
    file: ./secrets/api_key.txt

services:
  postgres:
    image: postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - mlflow_db_password
      - airflow_db_password
      - monitoring_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      # Over TCP on purpose: while the init script runs, the entrypoint's temporary server listens on the Unix
      # socket only, so the service turns healthy only after the databases exist.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  minio:
    # Upstream MinIO no longer publishes images; this is the community rebuild used in the lab.
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *logging

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: campaign-response-mlflow:local
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlflow
      # MLflow 3 rejects unknown Host headers (DNS rebinding); list every name the server is reached by.
      MLFLOW_ALLOWED_HOSTS: mlflow:5000,localhost:5500,127.0.0.1:5500,localhost:5000
    secrets:
      - mlflow_db_password
      - mlflow_s3_secret_key
    ports:
      - "127.0.0.1:5500:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl; Python's urllib does the same job.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: campaign-response-app:local
    command: ["python", "-m", "campaign_response.serving.main"]
    environment:
      CRP_API_HOST: 0.0.0.0
      CRP_LOG_FORMAT: json
      CRP_MLFLOW_TRACKING_URI: http://mlflow:5000
      CRP_PREDICTION_DB_HOST: postgres
    # Mounted under the names the settings read from /run/secrets (CRP_ prefix, lower case).
    secrets:
      - source: api_key
        target: crp_api_key
      - source: monitoring_db_password
        target: crp_prediction_db_password
    volumes:
      # Training data from the host, versioned by DVC (`dvc pull`); the API never writes it.
      - ./data/raw:/app/data/raw:ro
    ports:
      - "127.0.0.1:8000:8000"
    # Hardening: the code and image are read-only, only /tmp (model downloads, artifact files) is writable,
    # and the process can gain no privileges or capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      # Liveness only: before the first training there is no champion, and the API must still count as up so the
      # bootstrap job can call POST /train. Readiness is /health/ready.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  model-bootstrap:
    image: campaign-response-app:local
    command: ["python", "-m", "campaign_response.bootstrap"]
    environment:
      CRP_API_URL: http://api:8000
      CRP_LOG_FORMAT: json
    secrets:
      - source: api_key
        target: crp_api_key
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    # One-shot: trains the first champion if the registry has none, then exits (0 = a champion exists).
    restart: "no"
    logging: *logging

  minio-init:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_root_user
      - minio_root_password
      - mlflow_s3_secret_key
    volumes:
      - ./docker/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
      - ./docker/minio/mlflow-policy.json:/scripts/mlflow-policy.json:ro
    restart: "no"
    logging: *logging

volumes:
  postgres-data:
  minio-data:
